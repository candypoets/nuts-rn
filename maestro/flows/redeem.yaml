appId: com.nutsrn
---
# Invite-redeem e2e: a logged-in user opens an invite deep link, claims the
# invite in the RedeemModal, and lands on the community screen.
#
# Requires:
#   - a provisioned QA community + minted invite token (node .qa/qa-bootstrap.mjs)
#   - the redeem proxy running (bootstrap starts it; .qa/qa-redeem-proxy.mjs)
#   - Metro on :8084 with adb reverse tcp:8084 (maestro/flows/launch.yaml)
#
# Run (token/name from qa-bootstrap output / /tmp/qa-rn-community.json; the
# last three values have these usual values):
#   ANDROID_SERIAL=emulator-5554 npm run qa:device -- maestro/flows/redeem.yaml \
#     -e TOKEN=<token> -e COMMUNITY_NAME="QA RN Cafe <runid>" \
#     -e RELAY_PORT=7820 \
#     -e NSEC=nsec1h69a2vcpnyqe6c7rntwfvmwr42l6s344fk98mtxtgyz8qf3n985srsh0pe
# (NSEC = keys.users[0] from /root/code/strfry-badge-node/test/env/keys.json.)
# NOTE: no env defaults are declared here. Every variable must come from the
# caller so standalone and nested runs exercise the same fixture.
#
# Re-runnable against the same community: the modal's "already a member"
# short-circuit replaces the invite directly with the community screen.
#
# Also used as a subflow by the commerce flows (store-beer, store-gym-pass,
# event-capacity-full): they pass TOKEN / RELAY_PORT / NSEC / COMMUNITY_NAME
# explicitly via runFlow env so each scenario redeems its own community
# invite as a fresh member.
#
# Protocol-level proof afterwards: node .qa/qa-verify-redeem.mjs
- runFlow:
    file: login-nsec.yaml
    env:
      NSEC: ${NSEC}
# Open the invite deep link in the already-running app (no cold-start issue).
# relay= is the redeem proxy (10.0.2.2 = emulator host loopback); the app
# derives both the redeem endpoint and the community ws relay from it.
- openLink: "nutsrn://redeem?relay=http%3A%2F%2F10.0.2.2%3A${RELAY_PORT}&token=${TOKEN}"
# A fresh invite renders the modal. A rerun for an existing member may replace
# it with Community before the invitation copy reaches the accessibility tree.
- extendedWaitUntil:
    visible: ".*(You're invited to|${COMMUNITY_NAME}).*"
    timeout: 60000
- runFlow:
    when:
      visible: ".*You're invited to.*"
    commands:
      # Membership checking must settle before the claim action appears.
      - extendedWaitUntil:
          visible: "Claim invite"
          timeout: 60000
      - tapOn: "Claim invite"
      # Redeem POST + membership indexes + kind-0 replication (up to 60 s): be
      # generous with a cold membership cache and slow public relays.
      # Success replaces the invite route directly with Community; there is no
      # intermediary success screen or Open community button.
      - extendedWaitUntil:
          visible: ".*(${COMMUNITY_NAME}|Try again).*"
          timeout: 120000
# Retry transient failures like a user would — up to three attempts total. If
# the server already granted the award, retry resumes indexes/profile without
# consuming the invite again.
- runFlow:
    when:
      visible: "Try again"
    commands:
      - tapOn: "Try again"
      - extendedWaitUntil:
          visible: ".*(${COMMUNITY_NAME}|Try again).*"
          timeout: 120000
- runFlow:
    when:
      visible: "Try again"
    commands:
      - tapOn: "Try again"
      - extendedWaitUntil:
          visible: ".*${COMMUNITY_NAME}.*"
          timeout: 120000
# Both fresh and already-member paths converge directly on Community.
- extendedWaitUntil:
    visible: ".*${COMMUNITY_NAME}.*"
    timeout: 60000
- takeScreenshot: invite-redeemed
