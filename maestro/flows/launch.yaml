appId: com.nutsrn
---
# Setup subflow: launch dev-client, connect to Metro, land in the app.
- launchApp:
    clearState: true
# Launcher URL placeholder flips between exp:// and http:// — match either.
- tapOn: "(exp|http)://"
- inputText: "exp://localhost:8084"
- tapOn: "Connect"
# Dev menu may appear over the app on cold loads; skip it when it doesn't.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Dev menu tools panel can open as well; dismiss it.
- tapOn:
    text: "Close"
    optional: true
# Landed in the app: Explore feed visible. Cold bundle loads are slow.
- extendedWaitUntil:
    visible: "Switch to all"
    timeout: 180000
