appId: com.nutsrn
env:
  ITEM_NAME: "QA 10-Session Pass"
  ITEM_PRICE: "(€49,00|€49\\.00|49(\\.00)?\\s*EUR)"
---
# Sports pass purchase e2e: a fresh member redeems the QA gym invite, opens the
# community store, and buys a 10-session pass. Stripe is bypassed by the local
# checkout shim (.qa/qa-checkout-shim.mjs on :7821) — see store-beer.yaml for
# the full setup requirements (same Metro env, same shim).
#
# Run (values from /tmp/qa-rn-commerce.json; NSEC = keys.users[1] so the gym
# membership is fresh for this user):
#   MAESTRO_CLI_NO_ANALYTICS=1 ~/.maestro/bin/maestro test \
#     -e TOKEN=<gym-invite> -e RELAY_PORT=7822 -e NSEC=<users[1] nsec> \
#     -e COMMUNITY_NAME="QA RN Gym <runid>" \
#     maestro/flows/store-gym-pass.yaml
#
# The pass decrement itself (10 → 0 over check-ins) is a staff-side flow and is
# covered by the web harness in nuts-cash/.qa (Layer 3); the RN-side
# remaining-uses derivation is pinned by .qa/qa-verify-commerce.mjs.
- runFlow:
    file: redeem.yaml
    env:
      TOKEN: ${TOKEN}
      RELAY_PORT: ${RELAY_PORT}
      NSEC: ${NSEC}
      COMMUNITY_NAME: ${COMMUNITY_NAME}
- extendedWaitUntil:
    visible: "Store"
    timeout: 60000
- tapOn: "Store"
# Catalog presentation (sports preset): pass card from the sellable catalog.
- extendedWaitUntil:
    visible: "${ITEM_NAME}"
    timeout: 90000
- assertVisible: "Community store"
- assertVisible: "Pass"
- assertVisible: "10 uses"
- assertVisible:
    text: "${ITEM_PRICE}"
    optional: true
- takeScreenshot: store-gym-pass-catalog
- tapOn: "Get pass ${ITEM_NAME}"
- assertVisible:
    text: "Opening checkout…"
    optional: true
- extendedWaitUntil:
    visible: ".*(Payment successful|Use without an account|Chrome notifications).*"
    timeout: 90000
- runFlow:
    when:
      visible: "Use without an account"
    commands:
      - tapOn: "Use without an account"
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"
- extendedWaitUntil:
    visible: "Payment successful"
    timeout: 60000
- takeScreenshot: store-gym-pass-checkout
- launchApp:
    appId: com.nutsrn
    stopApp: false
- extendedWaitUntil:
    visible: "${ITEM_NAME}"
    timeout: 30000
