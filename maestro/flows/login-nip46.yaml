appId: com.nutsrn
---
# NIP-46 (bunker://) login against a fake remote signer.
#
# Requires the mock signer+relay from the nipworker repo running on the host:
#   node /root/code/nipworker/tests/e2e-browser/mock-signer-relay.mjs --port 7746
# It answers connect/get_public_key/sign_event with real signatures for the
# fixed test pubkey 6a04ab98…83eb3 (secret key 'aa'*32, tests only).
# NOTE: use 10.0.2.2 (emulator host loopback), not localhost — the Rust
# transport may resolve localhost to ::1, which adb reverse does not forward.
- runFlow: launch.yaml
# Home tab shows a sign-in stub when logged out.
- tapOn: "Home"
- assertVisible: "Your wallet, passes, and tickets"
- openLink: "nutsrn:///Login"
# Login modal.
- assertVisible: "Welcome back"
- assertVisible: "Use a signing app"
# Paste the bunker:// URI of the fake signer and submit.
- tapOn: "Paste key or connection link"
- inputText: "bunker://6a04ab98d9e4774ad806e302dddeb63bea16b5cb5f223ee77478e861bb583eb3?relay=ws%3A%2F%2F10.0.2.2%3A7746"
# Dismiss the keyboard by tapping inside the modal's ScrollView.
# (hideKeyboard can send a Back press when the IME never opened, which
# dismisses the whole login modal.)
- tapOn: "Choose how you want to sign in."
# "Sign in" also exists on the covered Home stub underneath the modal;
# anchor to the input field so the modal's submit button is tapped.
- tapOn:
    text: "Sign in"
    index: 1
# Success: the modal closes itself once the auth event lands.
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 60000
# Back on Home; logged-in feed replaces the sign-in stub.
- assertNotVisible: "Your wallet, passes, and tickets"
- takeScreenshot: nip46-logged-in
