appId: com.nutsrn
---
# Setup subflow: launch dev-client, connect to Metro, land in the app.
- launchApp:
    clearState: true
# Launcher home is up (server list/discovery populates asynchronously and its
# rows are NOT reliably exposed to the a11y tree — do not select on them).
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 30000
# Two layouts:
#  A) Metro discovered on the LAN: server rows + "+ New development server".
#  B) the manual URL form directly (placeholder flips between exp:// and
#     http://). In layout A, open the form explicitly.
- runFlow:
    when:
      visible: "New development server"
    commands:
      - tapOn: "New development server"
- extendedWaitUntil:
    visible: "(exp|http)://"
    timeout: 20000
- tapOn: "(exp|http)://"
- inputText: "exp://localhost:8084"
- tapOn: "Connect"
# Dev menu may appear over the app on cold loads; skip it when it doesn't.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Dev menu tools panel can open as well; dismiss it.
- tapOn:
    text: "Close"
    optional: true
# Landed in the app: Explore feed visible. Cold bundle loads are slow.
- extendedWaitUntil:
    visible: "Switch to all"
    timeout: 180000
# The launcher tools sheet can finish opening after the earlier optional Close
# tap. Covered app nodes remain in the hierarchy, so dismiss it by its unique
# Reload action before a scenario tries to tap the app underneath.
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: Back
      - extendedWaitUntil:
          notVisible: "Reload"
          timeout: 10000
